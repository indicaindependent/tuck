<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">What Tuck does</title>
<desc id="d">Four panels showing Tuck features: 01 Congress Trades from STOCK-Act disclosures; 02 Sector Heat Map ranking market sectors; 03 Market Scanner scoring geopolitical news signals; and 04 Ask Tuck free conversational AI powered by Llama 3.3.</desc>
<rect width="1200" height="330" fill="#0a0f1e"/>

<!-- Panel 1: Congress Trades -->
<g transform="translate(24, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <!-- Vector Icon: Disclosure document -->
  <rect x="44" y="36" width="54" height="68" rx="3" fill="#1a2236" stroke="#1e293b"/>
  <rect x="52" y="46" width="38" height="5" fill="#e8edf5"/>
  <rect x="52" y="57" width="28" height="4" fill="#aab4c5"/>
  <rect x="52" y="67" width="32" height="4" fill="#aab4c5"/>
  <rect x="52" y="77" width="22" height="4" fill="#22c55e"/>
  <rect x="52" y="89" width="38" height="5" fill="#eab308"/>

  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="1.5">01 / CONGRESS TRADES</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8edf5">
    <text x="24" y="182">STOCK-Act trade tracking</text>
    <text x="24" y="206">from Capitol disclosures.</text>
    <text x="24" y="230">See who bought or sold.</text>
  </g>
</g>

<!-- Panel 2: Sector Heat Map -->
<g transform="translate(314, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <!-- Vector Icon: Heatmap Grid -->
  <rect x="40" y="38" width="64" height="64" rx="4" fill="#1a2236" stroke="#1e293b"/>
  <rect x="46" y="44" width="28" height="28" rx="2" fill="#22c55e"/>
  <rect x="78" y="44" width="20" height="28" rx="2" fill="#3b82f6"/>
  <rect x="46" y="76" width="20" height="20" rx="2" fill="#eab308"/>
  <rect x="70" y="76" width="28" height="20" rx="2" fill="#ef4444"/>

  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="1.5">02 / SECTOR HEAT MAP</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8edf5">
    <text x="24" y="182">Realtime sector heat map</text>
    <text x="24" y="206">ranks market sectors</text>
    <text x="24" y="230">with regional filters.</text>
  </g>
</g>

<!-- Panel 3: Market Scanner -->
<g transform="translate(604, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <!-- Vector Icon: Scanner cards -->
  <rect x="40" y="38" width="64" height="64" rx="4" fill="#1a2236" stroke="#1e293b"/>
  <rect x="48" y="48" width="48" height="8" rx="2" fill="#ef4444"/>
  <rect x="48" y="60" width="36" height="8" rx="2" fill="#f97316"/>
  <rect x="48" y="72" width="42" height="8" rx="2" fill="#22c55e"/>
  <circle cx="82" cy="84" r="5" fill="#22c55e"/>

  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="1.5">03 / MARKET SCANNER</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8edf5">
    <text x="24" y="182">Geopolitical news signals</text>
    <text x="24" y="206">scored for market impact</text>
    <text x="24" y="230">with escalation tags.</text>
  </g>
</g>

<!-- Panel 4: Ask Tuck -->
<g transform="translate(894, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <!-- Vector Icon: Chat bubble -->
  <rect x="40" y="42" width="60" height="46" rx="6" fill="#1a2236" stroke="#1e293b"/>
  <path d="M52 88 L46 98 L62 88 Z" fill="#1a2236"/>
  <rect x="48" y="52" width="44" height="5" fill="#e8edf5"/>
  <rect x="48" y="62" width="32" height="4" fill="#22c55e"/>
  <rect x="48" y="71" width="24" height="4" fill="#aab4c5"/>

  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="1.5">04 / ASK TUCK</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e8edf5">
    <text x="24" y="182">Free conversational AI</text>
    <text x="24" y="206">powered by Llama 3.3 70B</text>
    <text x="24" y="230">connected to live feeds.</text>
  </g>
</g>
</svg>